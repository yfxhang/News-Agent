name: Test SMM RSS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run RSS reader
        env:
          DEEPSEEK_API_KEY:${{secrets.DEEPSEEK_API_KEY}}
        run: |
          python main.py

      - name: Save database
        run: |
          git config --global user.name "SMM News Agent"
          git config --global user.email "smm-news-agent@users.noreply.github.com"

          git add news.db

          git diff --cached --quiet || git commit -m "Update news database"

          git push
